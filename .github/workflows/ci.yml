name: CI

on:
  pull_request:
  push:
    branches: [main]

# Push novo mata a rodada anterior: a economia mais barata que existe (CI-PR.md §3.3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVA_ESCOPO: SPEC-012

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm check:gate
      # Dublês mTLS, PKI de teste e preparo dos segredos do Signer (scripts fora do workspace do turbo).
      - run: pnpm check:dubles
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Resumo da categoria
        if: always()
        run: >-
          node scripts/ci/write-summary.mjs quality "$PROVA_ESCOPO"
          "categoria sem suíte própria — lint, typecheck e os self-checks reportam por este job"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumo-quality
          # Mesma raiz dos demais jobs: o gate filtra por `*resumos*`, e publicar
          # so o conteudo da pasta deixaria o resumo fora do filtro.
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-regras:
    name: test-regras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:regras
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs regras "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-regras
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-banco:
    name: test-banco
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: contaia
          POSTGRES_USER: contaia
          POSTGRES_PASSWORD: contaia_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contaia -d contaia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://contaia:contaia_local@127.0.0.1:5432/contaia
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:banco
      # A matriz de RLS (SPEC-010) nasce dentro do pacote; a evidência sobe vinculada à SPEC e à issue.
      - name: Publicar rls-matrix.json
        if: always()
        run: |
          mkdir -p "test-results/$PROVA_ESCOPO/banco"
          if [ -f packages/db/test-results/banco/rls-matrix.json ]; then
            cp packages/db/test-results/banco/rls-matrix.json "test-results/$PROVA_ESCOPO/banco/rls-matrix.json"
          fi
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs banco "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-banco
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-tela:
    name: test-tela
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tela
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs tela "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-tela
          path: test-results/${{ env.PROVA_ESCOPO }}/

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A prova roda contra a MESMA composição do desenvolvimento local (infra/docker/compose.yml):
    # PostgreSQL, Redis, Keycloak, MinIO, Mailpit, Vault em modo servidor, o Signer isolado na rede
    # privada, os dublês mTLS, a API e os workers. Web e cofre seguem como processos do runner (o
    # Playwright os sobe), e a API os alcança por `host.docker.internal`.
    env:
      COMPOSE_PROJECT_NAME: contaia
      DATABASE_URL: postgresql://contaia:contaia_local@127.0.0.1:15432/contaia
      KEYCLOAK_ISSUER_URL: http://127.0.0.1:18080/realms/contaia
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local
      KEYCLOAK_CLIENT_ID: contaia-web
      KEYCLOAK_CLIENT_SECRET: contaia-web-local-secret
      KEYCLOAK_ADMIN_CLIENT_ID: contaia-api-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: contaia-api-admin-local-secret
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '11025'
      SMTP_FROM: no-reply@contaia.local
      MAILPIT_URL: http://127.0.0.1:18025
      WEB_PUBLIC_URL: http://127.0.0.1:15100
      WEB_ORIGIN: http://127.0.0.1:15100
      API_ORIGIN: http://127.0.0.1:15101
      # A API roda no Compose: o Playwright não a sobe (ver playwright.config.ts).
      API_EM_COMPOSE: '1'
      # O monitor do Signer verifica a cada 1 minuto; a prova de incidente e recuperação o encurta
      # para 5 s (três falhas seguidas abrem o incidente), em vez de esperar mais de 3 minutos.
      MONITOR_INTERVALO_MS: '5000'
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_BUCKET: contaia-documentos
      MINIO_ROOT_USER: contaia_local
      MINIO_ROOT_PASSWORD: contaia_local_secret
      # Cofre local de certificados A1 (SPEC-011). Os segredos são gerados em tempo de execução
      # pelo passo "Preparar o ambiente" (nada fixo no repositório).
      VAULT_IMAGE: hashicorp/vault:1.20
      VAULT_ADDR: http://127.0.0.1:18200
      VAULT_CONTAINER: contaia-vault
      COFRE_PORT: '15104'
      COFRE_PUBLIC_URL: http://127.0.0.1:15104
      COFRE_URL: http://127.0.0.1:15104
      # Embutida pelo Next no `pnpm build`: o navegador só envia o certificado a esta origem.
      NEXT_PUBLIC_COFRE_URL: http://127.0.0.1:15104
      # A API (contêiner) chama o cofre (processo do runner) por `host.docker.internal`, que chega
      # pela ponte do Docker, não pelo loopback: o runner é efêmero, então o cofre escuta em todas.
      COFRE_HOST: 0.0.0.0
      COFRE_API_URL: http://127.0.0.1:15101
      COFRE_ORIGENS_PERMITIDAS: http://127.0.0.1:15100
      # Mesmo motivo para o dublê da CNPJá: a API o alcança pelo host.
      CNPJA_URL: http://host.docker.internal:15310
      CNPJA_DUBLE_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # Segredos 100% efêmeros. Tudo que é sensível (unseal key, root token, tokens técnicos, PKI
      # de teste, chaves mTLS) fica em infra/docker/.vault-local/ (ignorado pelo Git), FORA de
      # test-results/, para nunca entrar em artefato da CI.
      - name: Preparar o ambiente e os segredos de teste
        run: |
          cp .env.example .env

          ticket_secret="$(openssl rand -hex 32)"
          service_token="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          echo "::add-mask::$ticket_secret"
          echo "::add-mask::$service_token"
          echo "::add-mask::$admin_token"

          vault_dir="$PWD/infra/docker/.vault-local"
          mkdir -p "$vault_dir"

          {
            echo "COFRE_TICKET_SECRET=$ticket_secret"
            echo "COFRE_SERVICE_TOKEN=$service_token"
            echo "COFRE_ADMIN_TOKEN=$admin_token"
            echo "VAULT_LOCAL_DIR=$vault_dir"
            echo "COFRE_VAULT_TOKEN_FILE=$vault_dir/token-cofre-ingestao"
            echo "COFRE_RAIZES_ICP_DIR=$vault_dir/raizes-icp"
            # Os contêineres de serviço rodam com o uid do dono dos arquivos de segredo (0600).
            echo "CONTAINER_UID=$(id -u)"
            echo "CONTAINER_GID=$(id -g)"
          } >> "$GITHUB_ENV"

          # Raiz e PFXs sintéticos; nada disto é ICP-Brasil real nem vai para o repositório.
          node scripts/gerar-pki-de-teste.mjs --saida "$vault_dir"
          # PKI mTLS dos serviços, dublês, pepper e ponto de montagem do token do Signer.
          COFRE_RAIZES_ICP_DIR="$vault_dir/raizes-icp" node scripts/preparar-segredos-do-signer.mjs
      # O PostgreSQL sobe primeiro: as migrations criam o papel `contaia_app`, sem o qual a API,
      # os workers e o Signer não conectam.
      - name: Subir o PostgreSQL, migrar e semear
        run: |
          docker compose --env-file .env -f infra/docker/compose.yml up -d --wait --wait-timeout 120 postgres
          pnpm db:migrate
          pnpm db:seed
      - name: Subir a composição (Vault, Signer, dublês, API, workers e o resto)
        run: |
          docker compose --env-file .env -f infra/docker/compose.yml up -d --build --wait --wait-timeout 600
          docker compose --env-file .env -f infra/docker/compose.yml ps
      - name: Diagnóstico da composição
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker/compose.yml ps -a
          docker compose --env-file .env -f infra/docker/compose.yml logs --no-color --tail=60
      - name: Provas de infraestrutura do Signer (alcance e política do Vault)
        # Na CI a composição tem de estar no ar: pular seria `not_run` e passaria verde por engano.
        env:
          EXIGIR_INFRA: '1'
        run: |
          mkdir -p "test-results/$PROVA_ESCOPO/e2e"
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination="test-results/$PROVA_ESCOPO/e2e/infra-signer-junit.xml" \
            infra/docker/signer-alcance.test.mjs infra/docker/vault/signer-politica.test.mjs
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Resumo da categoria
        if: always()
        # O job pode abortar antes do checkout (falha ao subir container): sem
        # o arquivo, o passo explodiria e esconderia a causa real.
        run: >-
          test -f scripts/ci/write-summary.mjs &&
          node scripts/ci/write-summary.mjs e2e "$PROVA_ESCOPO" ||
          echo "::warning::resumo de e2e não gerado: workspace indisponível"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-e2e
          path: test-results/${{ env.PROVA_ESCOPO }}/

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Consolida e valida; nao reexecuta suite (CI-PR.md §2).
    needs: [quality, test-regras, test-banco, test-tela, build, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Recolher artefatos das categorias
        uses: actions/download-artifact@v5
        with:
          path: artefatos
          merge-multiple: true
      - name: Reunir os resumos
        run: |
          mkdir -p "test-results/$PROVA_ESCOPO/resumos"
          find artefatos -name '*.json' -path '*resumos*' -exec cp {} "test-results/$PROVA_ESCOPO/resumos/" \; || true
          ls -la "test-results/$PROVA_ESCOPO/resumos/"
      - name: Reprovar se algum job obrigatório não teve sucesso
        run: |
          # Nome com hifen exige indice: `needs.test-regras` seria lido como subtracao.
          for resultado in "${{ needs.quality.result }}" "${{ needs['test-regras'].result }}" \
                           "${{ needs['test-banco'].result }}" "${{ needs['test-tela'].result }}" \
                           "${{ needs.build.result }}" "${{ needs.e2e.result }}"; do
            if [ "$resultado" != "success" ]; then
              echo "::error::job obrigatório terminou como '$resultado'"
              exit 1
            fi
          done
      - name: Validar as categorias obrigatórias
        run: node scripts/ci/validate-gate.mjs "test-results/$PROVA_ESCOPO/resumos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-resumo
          path: test-results/${{ env.PROVA_ESCOPO }}/resumos/
