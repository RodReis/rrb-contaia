name: CI

on:
  pull_request:
  push:
    branches: [main]

# Push novo mata a rodada anterior: a economia mais barata que existe (CI-PR.md §3.3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVA_ESCOPO: SPEC-011

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm check:gate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Resumo da categoria
        if: always()
        run: >-
          node scripts/ci/write-summary.mjs quality "$PROVA_ESCOPO"
          "categoria sem suíte própria — lint, typecheck e os self-checks reportam por este job"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumo-quality
          # Mesma raiz dos demais jobs: o gate filtra por `*resumos*`, e publicar
          # so o conteudo da pasta deixaria o resumo fora do filtro.
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-regras:
    name: test-regras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:regras
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs regras "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-regras
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-banco:
    name: test-banco
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: contaia
          POSTGRES_USER: contaia
          POSTGRES_PASSWORD: contaia_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contaia -d contaia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://contaia:contaia_local@127.0.0.1:5432/contaia
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:banco
      # A matriz de RLS (SPEC-010) nasce dentro do pacote; a evidência sobe vinculada à SPEC e à issue.
      - name: Publicar rls-matrix.json
        if: always()
        run: |
          mkdir -p "test-results/$PROVA_ESCOPO/banco"
          if [ -f packages/db/test-results/banco/rls-matrix.json ]; then
            cp packages/db/test-results/banco/rls-matrix.json "test-results/$PROVA_ESCOPO/banco/rls-matrix.json"
          fi
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs banco "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-banco
          path: test-results/${{ env.PROVA_ESCOPO }}/

  test-tela:
    name: test-tela
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tela
      - name: Resumo da categoria
        if: always()
        run: node scripts/ci/write-summary.mjs tela "$PROVA_ESCOPO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-tela
          path: test-results/${{ env.PROVA_ESCOPO }}/

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # O caminho crítico da SPEC-001 exige identidade e storage reais: sem estes
    # serviços a prova do wizard não roda na CI e a regressão só apareceria em
    # execução manual.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: contaia
          POSTGRES_USER: contaia
          POSTGRES_PASSWORD: contaia_local
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U contaia -d contaia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://contaia:contaia_local@127.0.0.1:15432/contaia
      KEYCLOAK_ISSUER_URL: http://127.0.0.1:18080/realms/contaia
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local
      KEYCLOAK_CLIENT_ID: contaia-web
      KEYCLOAK_CLIENT_SECRET: contaia-web-local-secret
      KEYCLOAK_ADMIN_CLIENT_ID: contaia-api-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: contaia-api-admin-local-secret
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '11025'
      SMTP_FROM: no-reply@contaia.local
      MAILPIT_URL: http://127.0.0.1:18025
      WEB_PUBLIC_URL: http://127.0.0.1:15100
      WEB_ORIGIN: http://127.0.0.1:15100
      API_ORIGIN: http://127.0.0.1:15101
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_BUCKET: contaia-documentos
      MINIO_ROOT_USER: contaia_local
      MINIO_ROOT_PASSWORD: contaia_local_secret
      # Cofre local de certificados A1 (SPEC-011). Os segredos e os caminhos do Vault são
      # gerados em tempo de execução pelo passo "Subir o Vault efêmero" (nada fixo no repositório).
      VAULT_IMAGE: hashicorp/vault:1.20
      VAULT_ADDR: http://127.0.0.1:18200
      VAULT_CONTAINER: contaia-vault
      COFRE_PORT: '15104'
      COFRE_PUBLIC_URL: http://127.0.0.1:15104
      COFRE_URL: http://127.0.0.1:15104
      # Embutida pelo Next no `pnpm build`: o navegador só envia o certificado a esta origem.
      NEXT_PUBLIC_COFRE_URL: http://127.0.0.1:15104
      COFRE_HOST: 127.0.0.1
      COFRE_API_URL: http://127.0.0.1:15101
      COFRE_ORIGENS_PERMITIDAS: http://127.0.0.1:15100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # Keycloak sobe por `docker run` e não como service container: o import do
      # realm precisa de um volume, que a sintaxe de `services` não expõe.
      - name: Subir MinIO, Keycloak e Mailpit
        run: |
          # Nenhum dos três roda como service container: o MinIO precisa do
          # argumento `server` e o Keycloak precisa de volume para importar o
          # realm — `services` não expõe `command` nem volume de bind.
          # O Mailpit captura o e-mail do convite (SPEC-007) para a prova E2E.
          docker run -d --name contaia-mailpit -p 127.0.0.1:11025:1025 -p 127.0.0.1:18025:8025 axllent/mailpit:v1.31.3

          # A imagem oficial saiu do quay.io e do Docker Hub (a tag fixada deixou de existir e
          # o `pull` responde `unauthorized`). A do Bitnami legado é o mesmo MinIO, congelada e
          # fixada por digest; entra pelo binário `minio`, como root, com o mesmo `/data`.
          docker run -d --name contaia-minio             -p 127.0.0.1:19000:9000             -e MINIO_ROOT_USER=contaia_local             -e MINIO_ROOT_PASSWORD=contaia_local_secret             --user 0:0 --entrypoint minio             bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c             server /data

          docker run -d --name contaia-keycloak             -p 127.0.0.1:18080:8080             -e KC_BOOTSTRAP_ADMIN_USERNAME=admin             -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin_local             -v "$PWD/infra/keycloak:/opt/keycloak/data/import:ro"             quay.io/keycloak/keycloak:26.5.2             start-dev --import-realm
          for tentativa in $(seq 1 40); do
            pronto=1
            curl -sf "http://127.0.0.1:19000/minio/health/live" >/dev/null || pronto=0
            curl -sf "http://127.0.0.1:18080/realms/contaia/.well-known/openid-configuration" >/dev/null || pronto=0
            curl -sf "http://127.0.0.1:18025/readyz" >/dev/null || pronto=0

            if [ "$pronto" = "1" ]; then
              echo "MinIO, Keycloak e Mailpit prontos"
              exit 0
            fi
            sleep 5
          done

          echo "::error::MinIO, Keycloak ou Mailpit não ficaram prontos"
          docker logs contaia-mailpit 2>&1 | tail -20
          docker logs contaia-minio 2>&1 | tail -20
          docker logs contaia-keycloak 2>&1 | tail -40
          exit 1
      # SPEC-011: Vault em modo servidor (nunca -dev) e material 100% efêmero. Tudo que é
      # sensível (unseal key, root token, tokens técnicos, PKI de teste) fica em
      # $RUNNER_TEMP, FORA de test-results/, para nunca entrar em artefato da CI.
      - name: Subir o Vault efêmero, fazer o bootstrap e gerar a PKI de teste
        run: |
          ticket_secret="$(openssl rand -hex 32)"
          service_token="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          echo "::add-mask::$ticket_secret"
          echo "::add-mask::$service_token"
          echo "::add-mask::$admin_token"

          vault_dir="$RUNNER_TEMP/vault-local"
          mkdir -p "$vault_dir"

          {
            echo "COFRE_TICKET_SECRET=$ticket_secret"
            echo "COFRE_SERVICE_TOKEN=$service_token"
            echo "COFRE_ADMIN_TOKEN=$admin_token"
            echo "VAULT_LOCAL_DIR=$vault_dir"
            echo "COFRE_VAULT_TOKEN_FILE=$vault_dir/token-cofre-ingestao"
            echo "COFRE_RAIZES_ICP_DIR=$vault_dir/raizes-icp"
          } >> "$GITHUB_ENV"

          docker run -d --name "$VAULT_CONTAINER"             -p 127.0.0.1:18200:8200             -e VAULT_ADDR=http://127.0.0.1:8200             -e SKIP_SETCAP=true             -e 'VAULT_LOCAL_CONFIG={"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"disable_mlock":true,"ui":false,"api_addr":"http://127.0.0.1:8200"}'             "$VAULT_IMAGE" server

          # O bootstrap espera o Vault subir, inicializa, desseleia e configura (idempotente).
          if ! VAULT_LOCAL_DIR="$vault_dir" node infra/docker/vault/bootstrap.mjs; then
            docker logs "$VAULT_CONTAINER" 2>&1 | tail -40
            exit 1
          fi

          # Raiz e PFXs sintéticos; nada disto é ICP-Brasil real nem vai para o repositório.
          node scripts/gerar-pki-de-teste.mjs --saida "$vault_dir"
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Resumo da categoria
        if: always()
        # O job pode abortar antes do checkout (falha ao subir container): sem
        # o arquivo, o passo explodiria e esconderia a causa real.
        run: >-
          test -f scripts/ci/write-summary.mjs &&
          node scripts/ci/write-summary.mjs e2e "$PROVA_ESCOPO" ||
          echo "::warning::resumo de e2e não gerado: workspace indisponível"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-e2e
          path: test-results/${{ env.PROVA_ESCOPO }}/

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Consolida e valida; nao reexecuta suite (CI-PR.md §2).
    needs: [quality, test-regras, test-banco, test-tela, build, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Recolher artefatos das categorias
        uses: actions/download-artifact@v5
        with:
          path: artefatos
          merge-multiple: true
      - name: Reunir os resumos
        run: |
          mkdir -p "test-results/$PROVA_ESCOPO/resumos"
          find artefatos -name '*.json' -path '*resumos*' -exec cp {} "test-results/$PROVA_ESCOPO/resumos/" \; || true
          ls -la "test-results/$PROVA_ESCOPO/resumos/"
      - name: Reprovar se algum job obrigatório não teve sucesso
        run: |
          # Nome com hifen exige indice: `needs.test-regras` seria lido como subtracao.
          for resultado in "${{ needs.quality.result }}" "${{ needs['test-regras'].result }}" \
                           "${{ needs['test-banco'].result }}" "${{ needs['test-tela'].result }}" \
                           "${{ needs.build.result }}" "${{ needs.e2e.result }}"; do
            if [ "$resultado" != "success" ]; then
              echo "::error::job obrigatório terminou como '$resultado'"
              exit 1
            fi
          done
      - name: Validar as categorias obrigatórias
        run: node scripts/ci/validate-gate.mjs "test-results/$PROVA_ESCOPO/resumos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-resumo
          path: test-results/${{ env.PROVA_ESCOPO }}/resumos/
