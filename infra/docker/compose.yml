name: ${COMPOSE_PROJECT_NAME:-contaia}

# Ambiente local do MVP-1 ao MVP-4 (ADR-012): instancia propria, portas proprias,
# nenhum servico em `latest` e nenhum segredo real. Nao ha deploy produtivo aqui.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: contaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - contaia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [contaia]

  redis:
    image: redis:8.2-alpine
    container_name: contaia-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - contaia_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [contaia]

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: contaia-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: '8080'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [contaia]

  minio:
    # A imagem oficial saiu do quay.io e do Docker Hub. A do Bitnami legado é o mesmo MinIO,
    # congelada e fixada por digest; entra pelo binário `minio`, como root, com o mesmo
    # `/data` (volumes antigos, criados como root, continuam legíveis).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: contaia-minio
    restart: unless-stopped
    user: '0:0'
    entrypoint: ['minio']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT}:9001'
    volumes:
      - contaia_minio:/data
    healthcheck:
      # `mc ready local` dependia do alias que a imagem oficial trazia pronto.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [contaia]

  # Capturador SMTP local (SPEC-007): o convite sai por aqui e a prova lê a
  # mensagem pela API HTTP. Nenhuma entrega externa real acontece nos MVPs 1-4.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: contaia-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks: [contaia]

networks:
  contaia:
    name: contaia_local

volumes:
  contaia_postgres:
    name: contaia_postgres
  contaia_redis:
    name: contaia_redis
  contaia_minio:
    name: contaia_minio
