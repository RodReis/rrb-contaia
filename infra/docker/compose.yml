name: ${COMPOSE_PROJECT_NAME:-contaia}

# Ambiente local do MVP-1 ao MVP-4 (ADR-012): instancia propria, portas proprias,
# nenhum servico em `latest` e nenhum segredo real. Nao ha deploy produtivo aqui.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - contaia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [contaia]

  redis:
    image: redis:8.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - contaia_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [contaia]

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: '8080'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [contaia]

  minio:
    # A imagem oficial saiu do quay.io e do Docker Hub. A do Bitnami legado é o mesmo MinIO,
    # congelada e fixada por digest; entra pelo binário `minio`, como root, com o mesmo
    # `/data` (volumes antigos, criados como root, continuam legíveis).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-minio
    restart: unless-stopped
    user: '0:0'
    entrypoint: ['minio']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT}:9001'
    volumes:
      - contaia_minio:/data
    healthcheck:
      # `mc ready local` dependia do alias que a imagem oficial trazia pronto.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [contaia]

  # Capturador SMTP local (SPEC-007): o convite sai por aqui e a prova lê a
  # mensagem pela API HTTP. Nenhuma entrega externa real acontece nos MVPs 1-4.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks: [contaia]

  # Cofre local de certificados A1 (SPEC-011 §6.1): Vault em modo SERVIDOR standalone
  # (nunca `-dev`), storage `file` em volume proprio, KV v2 e audit device persistentes.
  # Isto prova comportamento local com material de teste: nao e KMS/HSM, nao tem
  # auto-unseal nem alta disponibilidade e nao esta pronto para producao.
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20}
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-vault
    restart: unless-stopped
    command: ['server']
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # O entrypoint grava isto em /vault/config/local.json e sobe com `-config`.
      VAULT_LOCAL_CONFIG: >-
        {"storage":{"file":{"path":"/vault/file"}},
        "listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},
        "disable_mlock":true,"ui":false,"api_addr":"http://127.0.0.1:8200"}
      # `disable_mlock` dispensa a capability IPC_LOCK que o setcap do entrypoint pediria.
      SKIP_SETCAP: 'true'
    ports:
      - '127.0.0.1:${VAULT_PORT}:8200'
    volumes:
      # Os dois diretorios sao VOLUME da imagem; o entrypoint faz chown para o usuario `vault`.
      - contaia_vault:/vault/file
      - contaia_vault_audit:/vault/logs
    healthcheck:
      # Saude do PROCESSO: 0 = desselado, 2 = selado (normal apos reinicio), 1 = nao responde.
      # "Pronto" (inicializado + desselado) quem confere e o vault-bootstrap.
      test: ['CMD-SHELL', 'vault status >/dev/null 2>&1; [ $$? -ne 1 ]']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [contaia]

  # Mesmo script da CI (infra/docker/vault/bootstrap.mjs): inicializa, desseleia e
  # configura de forma idempotente e, em `--vigiar`, desseleia de novo apos um reinicio.
  # Chaves e tokens ficam em infra/docker/.vault-local/ (ignorado pelo Git).
  vault-bootstrap:
    image: node:24-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-contaia}-vault-bootstrap
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    command: ['node', '/app/bootstrap.mjs', '--vigiar']
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_LOCAL_DIR: /vault-local
    volumes:
      - ./vault/bootstrap.mjs:/app/bootstrap.mjs:ro
      - ./.vault-local:/vault-local
    healthcheck:
      # sys/health responde 200 somente com o Vault inicializado, desselado e ativo.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://vault:8200/v1/sys/health']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks: [contaia]

networks:
  contaia:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_local

volumes:
  contaia_postgres:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_postgres
  contaia_redis:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_redis
  contaia_minio:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_minio
  contaia_vault:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_vault
  contaia_vault_audit:
    name: ${COMPOSE_PROJECT_NAME:-contaia}_vault_audit
